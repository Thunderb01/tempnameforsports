# .github/workflows/probe-torvik-rosters.yml
# One-off diagnostic: run from the Actions tab to inspect Bart Torvik's
# next-season roster pages (allrosters*.php, trankpre.php, rostercast.php)
# from a runner that can actually reach barttorvik.com, so we know the real
# response shape before building an importer against it. No secrets, no DB
# writes — output only goes to the job log. Safe to delete once the real
# importer script is built and this has served its purpose.

name: Probe Bart Torvik Roster Pages (One-Time)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Probe roster pages
        run: python probe_torvik_rosters.py
