# .github/workflows/ci.yml
# Builds the app on every push and pull request against main.
# This is the only automated check in the repo today — there's no test
# suite, so a green check here means "compiles and doesn't bypass the
# lookup helpers" (npm run build includes check:lookups), not "behavior is
# correct." Shows up as a status check directly on the commit/PR in GitHub,
# ahead of and independent from Vercel's own build-on-deploy.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (includes check:lookups)
        run: npm run build
